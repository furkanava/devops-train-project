name: CI/CD Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── ADIM 1: Test ───────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Kodu checkout et
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Bağımlılıkları yükle
        run: pip install -r app/requirements.txt

      - name: Testleri çalıştır
        run: |
          cd app
          pytest test_app.py -v

  # ─── ADIM 2: Docker Build & Security Scan ───────────────────────
  build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Kodu checkout et
        uses: actions/checkout@v4

      - name: Image ismini küçük harfe çevir
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Docker Buildx kur
        uses: docker/setup-buildx-action@v3

      - name: Image build al
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      - name: Image'ı yükle
        run: docker load --input /tmp/image.tar

      - name: Docker image boyutunu göster
        run: |
          docker image inspect \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --format='Image boyutu: {{.Size}} byte'

        # Trivy sonucunu PR yorumunda kullanmak üzere dosyaya kaydeder
      - name: Trivy PR raporu oluştur
        uses: aquasecurity/trivy-action@master
        with:
          # Taranacak Docker image'ı belirtir
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}

          # Raporu okunabilir tablo biçiminde hazırlar
          format: "table"

          # Tarama sonucunu bu dosyaya kaydeder
          output: "trivy-results.txt"

          # Bu raporlama adımı pipeline'ı durdurmaz
          exit-code: "0"

          # Henüz çözümü olmayan açıkları dikkate almaz
          ignore-unfixed: true

          # Yalnızca yüksek ve kritik açıkları raporlar
          severity: "CRITICAL,HIGH"

      # Trivy raporunu yalnızca Pull Request çalışmalarında yorum olarak ekler
      - name: Trivy sonucunu PR'a yaz
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          # Her çalışmada yeni yorum oluşturmak yerine aynı yorumu günceller
          header: trivy-security-report

          # Yorumun içeriğini Trivy rapor dosyasından alır
          path: trivy-results.txt

      # Kritik veya yüksek açık bulunursa pipeline'ı durdurur
      - name: Trivy ile güvenlik taraması yap
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"



      - name: Image tar'ı artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  # ─── ADIM 3: Registry'ye Push (sadece main) ─────────────────────
  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Kodu checkout et
        uses: actions/checkout@v4

      - name: Image ismini küçük harfe çevir
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: GHCR'ye login ol
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata hazırla
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Image build al ve push et
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── ADIM 4: Kubernetes Deploy (sadece main) ─────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Kodu checkout et
        uses: actions/checkout@v4

      # Gerçek bir cluster için kubeconfig secret'ı kullanılır.
      # Bu adım şu an simüle ediliyor — gerçek deploy için aşağıdaki
      # satırların yorumunu kaldır ve KUBECONFIG secret'ını ekle.
      #
      # - name: kubectl kur
      #   uses: azure/setup-kubectl@v3
      #
      # - name: Kubeconfig ayarla
      #   run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
      #
      # - name: Deploy et
      #   run: |
      #     export KUBECONFIG=kubeconfig.yaml
      #     kubectl apply -f k8s/

      - name: Deploy simülasyonu
        run: |
          echo "✅ Deploy edilecek image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "✅ kubectl apply -f k8s/ komutu burada çalışacak"
          echo "ℹ️  Gerçek cluster bağlantısı için KUBECONFIG secret'ı gereklidir."
